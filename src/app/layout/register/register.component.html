<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-50 to-amber-50 py-8">
  <div class="max-w-4xl w-full px-4">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="flex justify-center mb-4">
          <div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-amber-500 rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-transform">
            <i class="fas fa-store text-white text-2xl"></i>
          </div>
        </div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-orange-600 to-amber-600 bg-clip-text text-transparent mb-2">
          RSTrading
        </h1>
        <h2 class="text-3xl font-bold text-gray-900 mb-2">Inscription</h2>
        <p class="text-gray-600">Créez votre compte client</p>
      </div>

      <!-- Form -->
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6" novalidate>
        
        <!-- Ligne 1 : Nom complet + Email -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Nom complet -->
          <div>
            <label for="full_name" class="block text-sm font-medium text-gray-700 mb-2">
              <i class="fas fa-user mr-2 text-gray-400"></i>
              Nom complet *
            </label>
            <input
              id="full_name"
              type="text"
              formControlName="full_name"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all duration-200"
              placeholder="Votre nom complet"
              [class.border-red-500]="isFieldInvalid('full_name')"
            >
            <div *ngIf="isFieldInvalid('full_name')" class="mt-2 text-sm text-red-600 animate-fade-in">
              <div *ngFor="let error of getFieldErrors('full_name')" class="flex items-center mb-1">
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span>{{ error }}</span>
              </div>
            </div>
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
              <i class="fas fa-envelope mr-2 text-gray-400"></i>
              Email *
            </label>
            <input
              id="email"
              type="email"
              formControlName="email"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all duration-200"
              placeholder="votre@email.com"
              [class.border-red-500]="isFieldInvalid('email')"
            >
            <div *ngIf="isFieldInvalid('email')" class="mt-2 text-sm text-red-600 animate-fade-in">
              <div *ngFor="let error of getFieldErrors('email')" class="flex items-center mb-1">
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span>{{ error }}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Ligne 2 : Téléphone + Adresse -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Téléphone -->
          <div>
            <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
              <i class="fas fa-phone mr-2 text-gray-400"></i>
              Téléphone
            </label>
            <input
              id="phone"
              type="tel"
              formControlName="phone"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all duration-200"
              placeholder="+221 77 123 45 67"
              [class.border-red-500]="isFieldInvalid('phone')"
            >
            <div *ngIf="isFieldInvalid('phone')" class="mt-2 text-sm text-red-600 animate-fade-in">
              <div *ngFor="let error of getFieldErrors('phone')" class="flex items-center mb-1">
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span>{{ error }}</span>
              </div>
            </div>
          </div>

          <!-- Adresse -->
          <div>
            <label for="address" class="block text-sm font-medium text-gray-700 mb-2">
              <i class="fas fa-map-marker-alt mr-2 text-gray-400"></i>
              Adresse
            </label>
            <input
              id="address"
              type="text"
              formControlName="address"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all duration-200"
              placeholder="Votre adresse"
            >
          </div>
        </div>

        <!-- Ligne 3 : Mot de passe + Confirmation -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Mot de passe -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
              <i class="fas fa-lock mr-2 text-gray-400"></i>
              Mot de passe *
            </label>
            <div class="relative">
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all duration-200 pr-12"
                placeholder="••••••••"
                [class.border-red-500]="isFieldInvalid('password')"
              >
              <button
                type="button"
                (click)="togglePassword()"
                class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 hover:text-gray-600 transition-colors duration-200"
                tabindex="-1"
              >
                <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
              </button>
            </div>
            <div *ngIf="isFieldInvalid('password')" class="mt-2 text-sm text-red-600 animate-fade-in">
              <div *ngFor="let error of getFieldErrors('password')" class="flex items-center mb-1">
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span>{{ error }}</span>
              </div>
            </div>
          </div>

          <!-- Confirmation mot de passe -->
          <div>
            <label for="password_confirmation" class="block text-sm font-medium text-gray-700 mb-2">
              <i class="fas fa-lock mr-2 text-gray-400"></i>
              Confirmation *
            </label>
            <div class="relative">
              <input
                id="password_confirmation"
                [type]="showConfirmPassword ? 'text' : 'password'"
                formControlName="password_confirmation"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all duration-200 pr-12"
                placeholder="••••••••"
                [class.border-red-500]="isFieldInvalid('password_confirmation')"
              >
              <button
                type="button"
                (click)="toggleConfirmPassword()"
                class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 hover:text-gray-600 transition-colors duration-200"
                tabindex="-1"
              >
                <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
              </button>
            </div>
            <div *ngIf="isFieldInvalid('password_confirmation')" class="mt-2 text-sm text-red-600 animate-fade-in">
              <div *ngFor="let error of getFieldErrors('password_confirmation')" class="flex items-center mb-1">
                <i class="fas fa-exclamation-circle mr-1"></i>
                <span>{{ error }}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Error Message -->
        <div
          *ngIf="errorMessage"
          class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg animate-fade-in"
        >
          <div class="flex items-center">
            <i class="fas fa-exclamation-circle mr-2"></i>
            {{ errorMessage }}
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98]"
        >
          <i *ngIf="isLoading" class="fas fa-spinner fa-spin mr-2"></i>
          <span *ngIf="!isLoading">S'inscrire</span>
          <span *ngIf="isLoading">Inscription...</span>
        </button>

        <!-- Login Link -->
        <div class="text-center">
          <p class="text-sm text-gray-600">
            Vous avez déjà un compte ?
            <button
              type="button"
              (click)="goToLogin()"
              class="font-medium text-orange-600 hover:text-orange-500 transition-colors duration-200"
            >
              Se connecter
            </button>
          </p>
        </div>
      </form>

      <!-- Footer -->
      <div class="text-center mt-6 text-sm text-gray-500">
        <p>© 2025 RSTrading - Tous droits réservés</p>
      </div>
    </div>
  </div>
</div>

<!-- Styles pour l'animation -->
<style>
  @keyframes fade-in {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-fade-in {
    animation: fade-in 0.3s ease-out;
  }
</style>
