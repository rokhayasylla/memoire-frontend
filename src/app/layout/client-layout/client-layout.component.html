<!-- Loading State -->
<div *ngIf="isLoading" class="fixed inset-0 bg-white flex items-center justify-center z-50">
  <div class="text-center">
    <div class="w-16 h-16 border-4 border-orange-200 border-t-orange-600 rounded-full animate-spin mx-auto mb-4"></div>
    <p class="text-gray-600">Vérification de l'authentification...</p>
  </div>
</div>

<!-- Main Content -->
<div *ngIf="!isLoading" class="min-h-screen bg-gray-50">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <!-- Logo -->
        <div class="flex items-center space-x-3">
  <div class="w-8 h-8 bg-gradient-to-br from-orange-500 to-amber-500 rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition-transform">       
    <i class="fas fa-store text-white text-sm"></i>
  </div>
  <div>
    <h1 class="text-xl font-bold bg-gradient-to-r from-orange-600 to-amber-600 bg-clip-text text-transparent">
      RSTrading
    </h1>
  </div>
</div>
        <!-- Navigation Tabs -->
        <div class="flex space-x-8">
          <button
            (click)="setActiveTab('products')"
            [class]="getTabClass('products')"
            class="py-2 px-4 border-b-2 font-medium text-sm transition-colors duration-200"
          >
            Produits
          </button>
        <button
            (click)="setActiveTab('packs')"
            [class]="getTabClass('packs')"
            class="py-2 px-4 border-b-2 font-medium text-sm transition-colors duration-200"
          >
          
          </button>

        </div>

        <!-- Right Side -->
        <div class="flex items-center space-x-4">
          <!-- User Info with Dropdown -->
          <div class="relative" *ngIf="currentUser">
            <button
              (click)="toggleUserMenu()"
              class="flex items-center space-x-2 hover:bg-gray-50 rounded-lg p-2 transition-colors"
            >
              <div class="w-8 h-8 bg-orange-100 rounded-full flex items-center justify-center">
                <i class="fas fa-user text-orange-600 text-sm"></i>
              </div>
              <span class="text-sm font-medium text-gray-700">{{ currentUser.full_name }}</span>
              <i class="fas fa-chevron-down text-xs text-gray-400 transition-transform"
                 [class.rotate-180]="showUserMenu"></i>
            </button>

            <!-- Dropdown Menu -->
            <div *ngIf="showUserMenu"
                 class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50">
              <button
                (click)="setActiveTab('orders')"
                class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center space-x-2"
              >
                <i class="fas fa-shopping-bag text-gray-400"></i>
                <span>Mes commandes</span>
              </button>
              <button
                (click)="setActiveTab('invoices')"
                class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center space-x-2"
              >
                <i class="fas fa-file-invoice text-gray-400"></i>
                <span>Mes factures</span>
              </button>
            </div>
          </div>
          




<!-- ========== BOUTON CHAT  ========== -->
<button 
  (click)="openChatModal()" 
  class="relative inline-flex items-center px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 transition-colors duration-200">
  <!-- Icône message -->
  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
          d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z">
    </path>
  </svg>
  Messages
  <!-- Badge pour les messages non lus -->
  <span *ngIf="unreadMessageCount > 0" 
        class="absolute -top-2 -right-2 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-500 rounded-full animate-pulse">
    {{ unreadMessageCount }}
  </span>
</button>

<!-- ========== MODAL CHAT  ========== -->
<div *ngIf="showChatModal" 
     class="fixed inset-0 z-50 overflow-y-auto" 
     (click)="closeChatModal()">
  <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
    <!-- Overlay -->
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>
    
    <!-- Modal Content -->
    <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full" 
         (click)="$event.stopPropagation()">
      
      <!-- Header du modal -->
      <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-medium text-gray-900">
            Messages - Support Client
          </h3>
          <button 
            (click)="closeChatModal()"
            class="text-gray-400 hover:text-gray-600 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        
        <!-- Composant Chat intégré -->
        <div class="h-96">
          <app-clientchat></app-clientchat>
        </div>
      </div>
    </div>
  </div>
</div>

          <!-- Cart -->
          <button
            (click)="openCartModal()"
            class="relative p-2 text-gray-600 hover:text-orange-600 transition-colors"
          >
            <i class="fas fa-shopping-cart text-xl"></i>
            <span
              *ngIf="cartItemCount > 0"
              class="absolute -top-1 -right-1 bg-orange-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center"
            >
              {{ cartItemCount }}
            </span>
          </button>

          <!-- Logout -->
          <button
            (click)="logout()"
            class="text-red-600 hover:text-red-800 p-2 rounded-lg hover:bg-red-50 transition-colors"
            title="Déconnexion"
          >
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>
      <div class="client-content"></div>
    </div>

  </nav>

  <!-- Click outside to close user menu -->
  <div *ngIf="showUserMenu"
       (click)="closeUserMenu()"
       class="fixed inset-0 z-40"></div>

  <!-- Content -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Products Tab -->
    <div *ngIf="activeTab === 'products'">
      <app-products-catalog></app-products-catalog>
    </div>

    <!-- Packs Tab -->
    <div *ngIf="activeTab === 'packs'">
      <app-packs-catalog></app-packs-catalog>
    </div>

    <!-- Orders Tab -->
    <div *ngIf="activeTab === 'orders'">
      <app-client-orders></app-client-orders>
    </div>

    <!-- Invoices Tab -->
    <div *ngIf="activeTab === 'invoices'">
      <app-client-invoices></app-client-invoices>
    </div>
  </div>

  <!-- Cart Modal -->
  <app-cart-modal
    *ngIf="showCartModal"
    (closeModal)="closeCartModal()"
  ></app-cart-modal>
</div>
