<div class="min-h-screen bg-gray-50">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <i class="fas fa-truck text-orange-600 text-2xl mr-3"></i>
          <span class="text-xl font-bold text-gray-900">RSTrading</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Sidebar + Content -->
  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-80 bg-white min-h-screen relative">
      <!-- User Info Section -->
      <div class="pt-8 px-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-1">Livreur</h2>
        <p class="text-gray-500 mb-8">Gestion</p>

        <!-- User Card -->
        <div class="pb-6 border-b border-gray-200 mb-6">
          <p class="text-base font-medium text-gray-900">{{ currentUser?.full_name }}</p>
          <p class="text-sm text-gray-500">Livreur</p>
        </div>
      </div>

      <!-- Navigation Menu -->
      <nav class="px-6 space-y-1">
        <!-- Livraisons -->
        <a 
          routerLink="/livreur" 
          [routerLinkActiveOptions]="{exact: true}" 
          routerLinkActive="bg-orange-50 text-orange-600 border-r-4 border-orange-600" 
          class="group flex items-center px-4 py-3 text-base font-medium rounded-l-lg hover:bg-gray-50 text-gray-700 transition-colors">
          <i class="fas fa-truck text-xl mr-4"></i>
          Livraisons
        </a>
      </nav>

      <!-- Déconnexion Button (Bottom) - EN DEHORS DU NAV -->
      <div class="absolute bottom-8 left-6 right-6">
        <button 
          (click)="logout()" 
          class="w-full flex items-center px-4 py-3 text-base font-medium rounded-lg hover:bg-red-50 text-red-600 transition-colors">
          <i class="fas fa-sign-out-alt text-xl mr-4"></i>
          Déconnexion
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 bg-gray-50">
      <!-- Header Section -->
      <div class="bg-white px-8 py-6 border-b border-gray-200">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Gestion des livraisons</h1>
        <p class="text-gray-600">Gérez les livraisons en cours</p>
      </div>

      <!-- Content Area -->
      <div class="p-8">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
