<div class="min-h-screen bg-gray-50">
  <!-- Sidebar + Content -->
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-lg flex flex-col relative">
      <!-- Header avec logo -->
      <div class="p-6 border-b border-gray-200">
        <div class="flex items-center space-x-3">
          <div class="w-8 h-8 bg-gradient-to-br from-orange-500 to-amber-500 rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition-transform">
            <i class="fas fa-store text-white text-sm"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-orange-600 to-amber-600 bg-clip-text text-transparent">
              RSTrading
            </h1>
            <p class="text-sm text-gray-500">Livraison</p>
          </div>
        </div>
      </div>

      <!-- User Card -->
      <div class="p-6 border-b border-gray-200">
        <p class="text-base font-medium text-gray-900">{{ currentUser?.full_name }}</p>
        <p class="text-sm text-gray-500">Livreur</p>
      </div>

      <!-- Navigation Menu -->
      <nav class="px-6 py-4 space-y-1 flex-1">
        <!-- Livraisons -->
        <a 
          routerLink="/livreur" 
          [routerLinkActiveOptions]="{exact: true}" 
          routerLinkActive="bg-orange-50 text-orange-600 border-r-4 border-orange-600" 
          class="group flex items-center px-4 py-3 text-base font-medium rounded-l-lg hover:bg-gray-50 text-gray-700 transition-colors">
          <i class="fas fa-truck text-xl mr-4"></i>
          Livraisons
        </a>
      </nav>

      <!-- Déconnexion Button (Bottom) -->
      <div class="p-6 border-t border-gray-200">
        <button 
          (click)="logout()" 
          class="w-full flex items-center px-4 py-3 text-base font-medium rounded-lg hover:bg-red-50 text-red-600 transition-colors">
          <i class="fas fa-sign-out-alt text-xl mr-4"></i>
          Déconnexion
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 bg-gray-50 overflow-auto">
      <!-- Header Section -->
      <div class="bg-white px-8 py-6 border-b border-gray-200">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Gestion des livraisons</h1>
        <p class="text-gray-600">Gérez les livraisons en cours</p>
      </div>

      <!-- Content Area -->
      <div class="p-8">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
