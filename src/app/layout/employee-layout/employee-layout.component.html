<!-- Loading -->
<div *ngIf="isLoading" class="fixed inset-0 bg-white flex items-center justify-center z-50">
  <div class="text-center">
    <div class="w-16 h-16 border-4 border-orange-200 border-t-orange-600 rounded-full animate-spin mx-auto mb-4"></div>
    <p class="text-gray-600">Chargement...</p>
  </div>
</div>

<!-- Page Employé -->
<div *ngIf="!isLoading" class="flex h-screen bg-gray-50">
  <!-- Sidebar -->
  <div class="w-64 bg-white shadow-lg flex flex-col">
    <div class="p-6 border-b border-gray-200">
      <h1 class="text-xl font-bold text-gray-900">Employé</h1>
      <p class="text-sm text-gray-500">Gestion</p>
    </div>

    <!-- Infos utilisateur -->
    <div class="p-4 border-b border-gray-200" *ngIf="currentUser">
      <p class="text-sm font-medium text-gray-900">{{ currentUser.full_name }}</p>
      <p class="text-xs text-gray-500">Employé</p>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 p-4 space-y-2">
      <button
        *ngFor="let item of menuItems"
        (click)="setActiveTab(item.key)"
        [ngClass]="getMenuItemClass(item.key)"
        class="w-full flex items-center space-x-3 px-4 py-3 text-left rounded-lg transition-all duration-200 hover:bg-gray-50"
      >
        <i [class]="item.icon + ' w-5 text-center'"></i>
        <span class="font-medium">{{ item.label }}</span>
      </button>
    </nav>

    <!-- Déconnexion -->
    <div class="p-4 border-t border-gray-200 mt-auto">
      <button (click)="logout()" class="w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-red-600 hover:bg-red-50 transition-colors">
        <i class="fas fa-sign-out-alt w-5 text-center"></i>
        <span>Déconnexion</span>
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <div class="bg-white shadow-sm border-b border-gray-200 p-6">
      <h2 class="text-2xl font-bold text-gray-900">
        {{ getActiveTabTitle() }}
      </h2>
      <p class="text-gray-600 mt-1">
        {{ getActiveTabSubtitle() }}
      </p>
    </div>

    <!-- Zone dynamique -->
    <div class="flex-1 overflow-auto p-6">
      
      
      <!-- Commandes -->
      <div *ngIf="activeTab === 'orders'">
        <app-employee-orders></app-employee-orders>
      </div>

      <!-- Livraisons -->
      <div *ngIf="activeTab === 'deliveries'">
        <app-employee-deliveries></app-employee-deliveries>
      </div>

      <!-- Support -->
      <div *ngIf="activeTab === 'support'">
        <app-employee-support></app-employee-support>
      </div>

      <!-- Message par défaut si aucun onglet n'est actif ou si l'onglet est invalide -->
      <div *ngIf="!activeTab || (activeTab !== 'orders' && activeTab !== 'deliveries' && activeTab !== 'support')" 
           class="text-center py-12">
        <div class="max-w-md mx-auto">
          <i class="fas fa-clipboard-list text-6xl text-gray-300 mb-4"></i>
          <h3 class="text-lg font-medium text-gray-900 mb-2">Aucun contenu sélectionné</h3>
          <p class="text-gray-500">Sélectionnez un élément du menu pour commencer à travailler.</p>
        </div>
      </div>
    </div>
  </div>
</div>
