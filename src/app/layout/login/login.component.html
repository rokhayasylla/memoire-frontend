<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-50 to-amber-50">
  <div class="max-w-md w-full space-y-8 p-8">
    <div class="bg-white rounded-2xl shadow-xl p-8">
  <div class="text-center mb-8">

  <div class="flex justify-center mb-4">
    <div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-amber-500 rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-transform">
      <i class="fas fa-store text-white text-2xl"></i>
    </div>
  </div>
  
  <!-- Nom de l'entreprise avec dégradé -->
  <h1 class="text-2xl font-bold bg-gradient-to-r from-orange-600 to-amber-600 bg-clip-text text-transparent mb-4">
    RSTrading
  </h1>
  
  <!-- Titre de la page -->
  <h2 class="text-3xl font-bold text-gray-900 mb-2">Connexion</h2>
  <p class="text-gray-600">Accédez à votre espace de gestion</p>
</div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6" novalidate>
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            <i class="fas fa-envelope mr-2 text-gray-400"></i>
            Email
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all duration-200"
            placeholder="votre@email.com"
            [class.border-red-500]="isFieldInvalid('email')"
            [class.focus:border-orange-500]="!isFieldInvalid('email')"
          >
          <!-- Animation d'apparition de l'erreur -->
          <div
            *ngIf="isFieldInvalid('email')"
            class="mt-2 text-sm text-red-600 animate-fade-in"
          >
            <div class="flex items-center">
              <i class="fas fa-exclamation-circle mr-1"></i>
              <span *ngIf="loginForm.get('email')?.errors?.['required']">L'email est requis</span>
              <span *ngIf="loginForm.get('email')?.errors?.['email']">Format d'email invalide</span>
            </div>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            <i class="fas fa-lock mr-2 text-gray-400"></i>
            Mot de passe
          </label>
          <div class="relative">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all duration-200 pr-12"
              placeholder="••••••••"
              [class.border-red-500]="isFieldInvalid('password')"
              [class.focus:border-orange-500]="!isFieldInvalid('password')"
            >
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 hover:text-gray-600 transition-colors duration-200"
              tabindex="-1"
            >
              <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
          <!-- Animation d'apparition de l'erreur -->
          <div
            *ngIf="isFieldInvalid('password')"
            class="mt-2 text-sm text-red-600 animate-fade-in"
          >
            <div class="flex items-center">
              <i class="fas fa-exclamation-circle mr-1"></i>
              <span>Le mot de passe est requis</span>
            </div>
          </div>
        </div>

        <!-- Error Message -->
        <div
          *ngIf="errorMessage"
          class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg animate-fade-in"
        >
          <div class="flex items-center">
            <i class="fas fa-exclamation-circle mr-2"></i>
            {{ errorMessage }}
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98]"
        >
          <i *ngIf="isLoading" class="fas fa-spinner fa-spin mr-2"></i>
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading">Connexion...</span>
        </button>

        <!-- Register Link -->
        <div class="text-center">
          <p class="text-sm text-gray-600">
            Vous n'avez pas de compte ?
            <button
              type="button"
              (click)="goToRegister()"
              class="font-medium text-orange-600 hover:text-orange-500 transition-colors duration-200"
            >
              S'inscrire
            </button>
          </p>
        </div>
      </form>


    </div>
  </div>
</div>

<!-- Styles pour l'animation -->
<style>
  @keyframes fade-in {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-fade-in {
    animation: fade-in 0.3s ease-out;
  }
</style>
